version: "3.8"

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: persistent-ai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: business_analytics
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Multi-Agent Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: persistent-ai-backend
    restart: always
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: business_analytics
      DB_USER: root
      DB_PASSWORD: password
      FRONTEND_URL: http://localhost:5173
      MEMORY_DB_PATH: /app/memory/checkpoints.db
    ports:
      - "8000:8000"
    volumes:
      - memory_data:/app/memory
    depends_on:
      mysql:
        condition: service_healthy

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: persistent-ai-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  memory_data:
